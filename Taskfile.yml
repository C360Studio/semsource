version: "3"

vars:
  # Pinned to match the lint job in .github/workflows/ci.yml. revive runs with
  # warningCode=1, so warnings are fatal and an unpinned release can fail CI on
  # a new rule with no code change. Bump this and ci.yml together — tools:check
  # fails loudly when a local install drifts from the pin, which is otherwise
  # how you get a green local lint and a red CI one.
  REVIVE_VERSION: v1.15.0
  # The ateam pin. Installed into the MAIN checkout's gitignored .tools/bin, so it
  # survives reboots, is shared by every linked worktree, and never collides with
  # a sister repo pinning another release in the shared $(go env GOPATH)/bin.
  # Hooks and MCP reach it through scripts/ateam; gates run it directly.
  ATEAM_VERSION: v0.4.0
  ATEAM_BIN_DIR:
    sh: echo "$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")/.tools/bin"
  ATEAM: "{{.ATEAM_BIN_DIR}}/ateam"
  # ateam state spec-check shells out to openspec; CI installs this release.
  OPENSPEC_VERSION: 1.7.0

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build semsource binary
    cmds:
      - go build -o bin/semsource ./cmd/semsource

  tools:install:
    desc: Install pinned Go dev tools (revive; ateam into .tools/bin)
    cmds:
      - go install github.com/mgechev/revive@{{.REVIVE_VERSION}}
      - task: tools:ateam

  tools:ateam:
    desc: Install the pinned ateam into the main checkout's .tools/bin (skips when already at the pin)
    status:
      - '"{{.ATEAM}}" version 2>/dev/null | grep -q "ateam {{.ATEAM_VERSION}} "'
    cmds:
      - GOBIN="{{.ATEAM_BIN_DIR}}" GOTOOLCHAIN=auto go install github.com/c360studio/ateam/cmd/ateam@{{.ATEAM_VERSION}}

  tools:openspec:
    desc: Install the pinned openspec CLI globally with npm (CI; spec:check needs it on PATH)
    status:
      - 'openspec --version 2>/dev/null | grep -qx "{{.OPENSPEC_VERSION}}"'
    cmds:
      - npm install -g @fission-ai/openspec@{{.OPENSPEC_VERSION}}

  # The session variables are unset so a gate run never takes the writer lease.
  ateam:doctor:
    desc: Run ateam doctor --check with the pinned ateam (installs it first if missing or drifted)
    deps: [tools:ateam]
    cmds:
      - env -u ATEAM_SESSION_ID -u CLAUDE_SESSION_ID -u CODEX_SESSION_ID -u GEMINI_SESSION_ID "{{.ATEAM}}" doctor --check

  spec:check:
    desc: openspec validate --all --strict, then fail on a Hold written outside every task (ateam state spec-check)
    deps: [tools:ateam]
    cmds:
      - '"{{.ATEAM}}" state spec-check'

  spec:queue:
    desc: Show each in-flight OpenSpec change with its ticked/total count, holds and caveats
    deps: [tools:ateam]
    cmds:
      - '"{{.ATEAM}}" state spec-queue'

  merge:check:
    desc: Run ateam review gate on PR <n> (-- <n>) — required checks on main, attestation lines and review record, open class:flake issues. Reads GitHub, so not in check
    deps: [tools:ateam]
    cmds:
      # The checks the main ruleset requires; ateam defaults to "Required", which
      # this repo does not have. Keep in step with merge-check.yml's list.
      - ATEAM_REQUIRED_CHECKS="${ATEAM_REQUIRED_CHECKS:-lint,test,test-integration,ui-quality,e2e-local,Merge check}" "{{.ATEAM}}" review gate {{.CLI_ARGS}}

  tools:check:
    desc: Verify pinned Go dev tools are installed at the expected version
    silent: true
    cmds:
      - >-
        command -v revive >/dev/null 2>&1 ||
        { echo "revive is not installed. Run: task tools:install"; exit 1; }
      - >-
        installed="$(revive --version 2>/dev/null | awk '{print $NF}')";
        expected="$(printf '%s' '{{.REVIVE_VERSION}}' | sed 's/^v//')";
        [ "$installed" = "$expected" ] ||
        { echo "revive $installed is installed but $expected is pinned. Run: task tools:install"; exit 1; }

  lint:
    desc: Run Go linters (vet, fmt check, revive)
    cmds:
      - task: tools:check
      # npm dependencies can contain unrelated Go source. Keep backend gates
      # scoped to SemSource packages even after the owned UI has been installed.
      - >-
        packages="$(go list ./...)" &&
        packages="$(printf '%s\n' "$packages" | grep -v '/ui/node_modules/')" &&
        go vet $packages
      - >-
        test -z "$(find . -path './ui/node_modules' -prune -o -name '*.go' -print |
        xargs gofmt -l)" ||
        (find . -path './ui/node_modules' -prune -o -name '*.go' -print |
        xargs gofmt -l && exit 1)
      - >-
        packages="$(go list ./...)" &&
        packages="$(printf '%s\n' "$packages" | grep -v '/ui/node_modules/')" &&
        revive -config revive.toml -formatter friendly $packages

  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  test:race:
    desc: Run unit tests with race detector
    cmds:
      - go test -race ./...

  agents:check:
    desc: Verify agent contracts, adapters, and shared skills against the semstreams pin
    cmds:
      - ./scripts/check-agent-sync.sh

  test:e2e:
    desc: Run e2e tests (requires Docker)
    cmds:
      - go test -tags=e2e -timeout 300s ./test/e2e/

  ui:e2e:
    desc: Run locked containerized Playwright against a running UI profile
    cmds:
      - ./scripts/ui-profile-e2e.sh

  ui:image:verify:
    desc: Build and verify the SemSource workbench production image
    cmds:
      - ./scripts/ui-image-verify.sh

  ui:image:release:test:
    desc: Test immutable UI release-image verification without registry access
    cmds:
      - ./scripts/test-ui-image-metadata.sh
      - ./scripts/test-ui-profile-pin-verify.sh
      - ./scripts/test-ui-profile-smoke-preflight.sh
      - ./scripts/test-ui-release-image-verify.sh
      - ./scripts/test-ui-publish-workflow.sh

  ui:smoke:
    desc: Smoke an immutable released SemSource UI image without host Node
    cmds:
      - ./scripts/ui-profile-smoke.sh released

  ui:smoke:dev:
    desc: Build ./ui, smoke the local UI profile, then tear it down
    cmds:
      - ./scripts/ui-profile-smoke.sh dev

  core:smoke:
    desc: Start the core profile, poll source-manifest status, then tear it down
    cmds:
      - ./scripts/core-profile-smoke.sh

  tier2:smoke:dev:
    desc: Check the tier-2 dev overlay's composition, pins, and config wiring (no bring-up)
    cmds:
      - ./scripts/tier2-dev-smoke.sh

  check:
    desc: Run all checks (lint + harness doctor + OpenSpec + test)
    cmds:
      - task: lint
      - task: ateam:doctor
      - task: spec:check
      - task: test
