# #337 5.3 override: SemSource built locally from the branch head (the base
# compose file's build), the beta.10 corpora and config, isolated ports.
# FIX329_CONFIGS holds tier0.json and tier0-reversed.json; FIX329_CORPUS is the corpus tree.
services:
  semsource:
    ports: !override
      - "127.0.0.1:28080:8080"
    volumes: !override
      - ${FIX329_CONFIGS:?set FIX329_CONFIGS}:/etc/semsource:ro
      - ${FIX329_CORPUS:?set FIX329_CORPUS}:/workspace:ro
    restart: "no"
  nats:
    ports: !override
      - "127.0.0.1:25222:4222"
      - "127.0.0.1:29222:8222"
