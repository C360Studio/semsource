# #233 part 2 override: main e5d90d3 (SemEngine v0.1.0-alpha.5), the #230 corpora,
# configs/mvp.json (ast + docs + config, graph-lexical tier 0), isolated ports.
services:
  semsource:
    image: ghcr.io/c360studio/semsource:e5d90d3
    build: !reset null
    ports: !override
      - "127.0.0.1:28080:8080"
    volumes: !override
      - /tmp/sem233/configs:/etc/semsource:ro
      - ${SEM233_CORPUS}:/workspace:ro
    restart: "no"
  nats:
    ports: !override
      - "127.0.0.1:25222:4222"
      - "127.0.0.1:29222:8222"
