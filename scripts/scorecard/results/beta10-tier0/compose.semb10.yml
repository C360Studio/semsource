# #237 post-tag override: the RELEASED v1.0.0-beta.10 core image, pinned by its
# index digest from tag run 44797269782, the #230 corpora, isolated ports.
# SEMB10_CONFIGS holds tier0.json (and tier0-reversed.json for R1); SEMB10_CORPUS
# is the corpus tree.
services:
  semsource:
    image: ghcr.io/c360studio/semsource:1.0.0-beta.10@sha256:98584d13e4024b0792802e7bd4550b784e2900f508309056e4fc9041150850f3
    build: !reset null
    ports: !override
      - "127.0.0.1:28080:8080"
    volumes: !override
      - ${SEMB10_CONFIGS:?set SEMB10_CONFIGS}:/etc/semsource:ro
      - ${SEMB10_CORPUS:?set SEMB10_CORPUS}:/workspace:ro
    restart: "no"
  nats:
    ports: !override
      - "127.0.0.1:25222:4222"
      - "127.0.0.1:29222:8222"
