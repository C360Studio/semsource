name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Unit tests
        run: go test -race ./...

  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # The critical-path integration suites (MCP answers, fusion pipeline,
      # versionDiff, readiness, staleness lifecycle) self-provision NATS via
      # testcontainers, and the object store suite provisions MinIO the same
      # way; ubuntu-latest runners ship Docker, so no service-container
      # choreography is needed here.
      #
      # The package list is derived from the files that carry the integration
      # build tag, not kept by hand: a hand list silently dropped six packages
      # whose tests compiled, passed locally, and never ran here (#254). Not
      # ./..., which would rerun every unit test the test job already ran.
      - name: Integration tests
        run: |
          pkgs=$(grep -rlE --exclude-dir=node_modules --include='*_test.go' '^//go:build integration( |$)' . \
            | xargs -n1 dirname | sed 's|^\./||; s|^|./|' | sort -u)
          if [ -z "$pkgs" ]; then
            echo "no integration-tagged test files found; the discovery pattern is broken" >&2
            exit 1
          fi
          echo "Integration packages:"
          echo "$pkgs"
          go test -tags=integration $pkgs

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/setup-task

      # The revive pin lives in Taskfile.yml's REVIVE_VERSION, and the vet /
      # gofmt / revive invocations live in its lint task. CI runs that one
      # definition rather than keeping a second copy that can drift from it —
      # and these copies already had drifted: they linted ./... including
      # ui/node_modules, which task lint deliberately filters out.
      - name: Install pinned dev tools
        run: |
          task tools:install
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: task lint

      # Agent configuration is only useful if it is true. This catches a vendored
      # decision skill drifting from the framework truth it copies, an upstream
      # edit to one we deliberately forked, and an adapter that has stopped
      # naming its canonical contract — including the missing-frontmatter case
      # that left both reviewers advertised but undiscoverable.
      - name: Agent configuration
        run: task agents:check

      # The ateam pin is Taskfile.yml's ATEAM_VERSION (tools:install put it in
      # .tools/bin); merge-check.yml installs the same pin, so there is no
      # second copy here to drift.
      - name: Harness doctor
        run: task ateam:doctor

      - name: OpenSpec strict validation and holds
        run: |
          task tools:openspec
          task spec:check

  ui-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install locked UI dependencies
        run: npm ci --ignore-scripts
        working-directory: ui

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
        working-directory: ui

      - name: UI format
        run: npm run format:check
        working-directory: ui

      - name: UI lint
        run: npm run lint
        working-directory: ui

      - name: UI type and Svelte checks
        run: npm run check
        working-directory: ui

      - name: UI unit tests
        run: npm test
        working-directory: ui

      - name: UI accessibility tests
        run: npm run test:a11y
        working-directory: ui

      - name: UI production build
        run: npm run build
        working-directory: ui

      - name: UI end-to-end tests
        run: npm run test:e2e
        working-directory: ui

      - uses: docker/setup-buildx-action@v4

      - uses: ./.github/actions/setup-task

      - name: Clean production image verification
        env:
          SEMSOURCE_UI_VERSION: sha-${{ github.sha }}
          SEMSOURCE_UI_COMMIT: ${{ github.sha }}
        run: task ui:image:verify

      - name: Release verifier contract tests
        run: task ui:image:release:test

  # The e2e suite is split by what a test COSTS, not by what it covers.
  #
  # This job runs the tests that need only Docker-backed NATS and a locally
  # built binary — no external repository is cloned, so nothing here depends on
  # a third-party host being up. Measured at ~26s of test time, plus ~130s for
  # TestE2E_DiscoveryAcrossRestarts (three boots against local git fixtures),
  # plus ~15s for the GRAPH retention pair (#160): a warm restart within the
  # stream window, and the boot refusal over a beta.10 limits GRAPH stream.
  #
  # Deliberately excluded, and where they run instead:
  #   TestE2E_OSH_JavaMavenIngest  clones github.com/opensensorhub/osh-core, a
  #                               large third-party repo (~29s). Its
  #                               availability is not ours, so it stays out of
  #                               the PR gate; run before release cuts.
  #   TestE2E_SubmoduleIngest      clones the C360Studio/semdev-test fixtures
  #                               (~27s). Same fixtures quickstart.yml already
  #                               clones, so promoting it is a bandwidth
  #                               question rather than a trust one.
  #   TestE2E_Quickstart*          already gated by quickstart.yml on its own
  #                               path filter; running them here would duplicate.
  #
  # TestE2E_UpgradePathRehearsal is the reason this job exists: it is the
  # executable proof of the documented upgrade path (purge graph state, restart,
  # graph re-derives from source, unrelated state survives). It went red on the
  # beta.161 bump and nobody saw it, because no e2e job ran in CI.
  e2e-local:
    runs-on: ubuntu-latest
    # The Tier 0 gate (known-answer corpus x2, core:smoke with a cold image
    # build) measured 2m20s on top of about 3 minutes of black-box and
    # lifecycle steps; 20 leaves room for a slow image build.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Black-box e2e (no external clones)
        run: |
          go test -tags=e2e -v -timeout 10m ./test/e2e/ \
            -run 'TestE2E_Version|TestE2E_Validate|TestE2E_NativeQuickStart|TestE2E_RunStartsAndPublishesEntities|TestE2E_RunFailsGracefullyWithoutNATS|TestE2E_RuntimeSourceAdd|TestE2E_UpgradePathRehearsal|TestE2E_DiscoveryAcrossRestarts|TestE2E_WarmRestartWithinStreamWindow|TestE2E_LimitsGraphStreamRefusesBoot|TestE2E_BootIntoFullGraphStream'


      - name: Desired source lifecycle without private recovery
        env:
          SETUP03A_NATS_IMAGE: nats:2.14.4-alpine@sha256:f2123f533c2b0cada0a5c5ec434fb2b8cfe1cf220215ef9d7517e1372917ad66
        run: |
          # The frozen harness expects docker run output to contain only its ID.
          docker pull "$SETUP03A_NATS_IMAGE"
          qualification_dir="$RUNNER_TEMP/source-lifecycle-qualification"
          mkdir -p "$qualification_dir"
          go build -o "$qualification_dir/semsource" ./cmd/semsource
          SETUP03A_BINARY="$qualification_dir/semsource" \
            SETUP03A_OUT="$qualification_dir/evidence" \
            SETUP03A_IDENTITY=governed SETUP03A_PROFILE=bm25 \
            go test -tags=qualification,removal -count=1 -v -timeout 10m ./test/setup03a \
              -run '^TestDesiredSourceLifecycleWithoutRecovery$'

      - name: Preserve source lifecycle failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desired-source-lifecycle-${{ github.sha }}
          path: ${{ runner.temp }}/source-lifecycle-qualification/evidence/**
          if-no-files-found: ignore

      # Tier 0 gate (#265): the tag ships Tier 0, so both Tier 0 compositions
      # answer the known-answer corpus — foundation (no search index) and
      # statistical (graph-lexical) — and the shipped default boots under
      # compose. Keyed by profile name, not by which components run.
      - name: Tier 0 known-answer corpus
        env:
          SETUP03A_NATS_IMAGE: nats:2.14.4-alpine@sha256:f2123f533c2b0cada0a5c5ec434fb2b8cfe1cf220215ef9d7517e1372917ad66
        run: |
          docker pull "$SETUP03A_NATS_IMAGE"
          corpus_dir="$RUNNER_TEMP/tier0-corpus"
          mkdir -p "$corpus_dir"
          go build -o "$corpus_dir/semsource" ./cmd/semsource
          for profile in foundation bm25; do
            SETUP03A_BINARY="$corpus_dir/semsource" \
              SETUP03A_OUT="$corpus_dir/evidence-$profile" \
              SETUP03A_IDENTITY=governed SETUP03A_PROFILE="$profile" \
              go test -tags=qualification -count=1 -v -timeout 10m ./test/setup03a \
                -run '^TestKnownAnswerCorpus$'
          done

      - name: Preserve Tier 0 corpus failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tier0-known-answer-corpus-${{ github.sha }}
          path: ${{ runner.temp }}/tier0-corpus/evidence-*/**
          if-no-files-found: ignore

      - name: Core profile smoke (shipped default and Tier 0 statistical configs)
        run: ./scripts/core-profile-smoke.sh

  build-and-push:
    needs: [test, lint, test-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # Runs on main pushes and on release tags (v*). Tag pushes produce the
    # versioned image; `latest` only moves on the default branch (not on a
    # pre-release beta tag).
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # type=ref,event=tag is the git tag verbatim (v1.0.0-beta.N), as the
          # UI image publishes. type=semver drops every pattern but {{version}}
          # on a prerelease (#402), so a v-prefixed semver pattern emits nothing.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=ref,event=tag

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Inject the resolved version into the binary. On a tag build this is
          # the semver (e.g. 1.0.0-beta.1); on main it's the branch/sha fallback.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Each platform builds on its own native runner and pushes by digest; the
  # publish-ui job below merges the digests into one tagged index. arm64 does
  # not run under QEMU: node/npm hit an intermittent SIGILL in `npm ci` under
  # emulation and hung the job to its timeout (semsource#219).
  publish-ui-build:
    needs: [test, lint, ui-quality]
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v6

      - name: Derive immutable UI image metadata
        id: image
        env:
          IMAGE_REPOSITORY: ghcr.io/c360studio/semsource-ui
          SOURCE_REF: ${{ github.ref }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          ./scripts/ui-image-metadata.sh \
            --repository "$IMAGE_REPOSITORY" \
            --ref "$SOURCE_REF" \
            --ref-name "$SOURCE_REF_NAME" \
            --revision "$SOURCE_REVISION" \
            --output "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the workbench image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./ui
          platforms: linux/${{ matrix.arch }}
          build-args: |
            SEMSOURCE_UI_VERSION=${{ steps.image.outputs.version }}
            SEMSOURCE_UI_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ steps.image.outputs.repository }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true

      - name: Record the platform digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '%s\n' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$' ||
            { echo "build did not report a sha256 digest: $DIGEST" >&2; exit 1; }
          mkdir -p ui-digests
          printf '%s\n' "$DIGEST" >"ui-digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v7
        with:
          # No attempt suffix: re-running one failed leg overwrites only its
          # own digest and the merge still finds the other leg's.
          name: semsource-ui-digest-${{ matrix.arch }}
          path: ui-digests/${{ matrix.arch }}
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  publish-ui:
    needs: publish-ui-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.repository }}
      digest: ${{ steps.publish.outputs.digest }}
      smoke_tag: ${{ steps.image.outputs.primary_tag }}
      version: ${{ steps.image.outputs.version }}
      revision: ${{ steps.image.outputs.revision }}
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v6

      - name: Derive immutable UI image metadata
        id: image
        env:
          IMAGE_REPOSITORY: ghcr.io/c360studio/semsource-ui
          SOURCE_REF: ${{ github.ref }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          ./scripts/ui-image-metadata.sh \
            --repository "$IMAGE_REPOSITORY" \
            --ref "$SOURCE_REF" \
            --ref-name "$SOURCE_REF_NAME" \
            --revision "$SOURCE_REVISION" \
            --output "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          pattern: semsource-ui-digest-*
          path: ui-digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform workbench image
        id: publish
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_TAGS: ${{ steps.image.outputs.tags }}
          PRIMARY_TAG: ${{ steps.image.outputs.primary_tag }}
        run: ./scripts/ui-image-merge.sh ui-digests

  ui-release-smoke:
    needs: publish-ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup-task

      - name: Verify immutable registry image and provenance
        id: verify
        env:
          IMAGE_REPOSITORY: ${{ needs.publish-ui.outputs.image }}
          IMAGE_TAG: ${{ needs.publish-ui.outputs.smoke_tag }}
          IMAGE_DIGEST: ${{ needs.publish-ui.outputs.digest }}
          IMAGE_VERSION: ${{ needs.publish-ui.outputs.version }}
          IMAGE_REVISION: ${{ needs.publish-ui.outputs.revision }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p release-evidence
          ./scripts/ui-release-image-verify.sh \
            --repository "$IMAGE_REPOSITORY" \
            --tag "$IMAGE_TAG" \
            --digest "$IMAGE_DIGEST" \
            --version "$IMAGE_VERSION" \
            --revision "$IMAGE_REVISION" \
            --run-url "$RUN_URL" \
            --run-attempt "$RUN_ATTEMPT" \
            --output "$GITHUB_OUTPUT" \
            --evidence release-evidence/semsource-ui-image.md

      - name: Smoke exact published workbench digest
        env:
          SEMSOURCE_UI_IMAGE: ${{ steps.verify.outputs.image_ref }}
          UI_PROFILE_PIN_EVIDENCE_FILE: release-evidence/semsource-ui-image.md
        run: task ui:smoke

      - name: Upload UI profile failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: semsource-ui-smoke-failure-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: test-results/ui-profile/**
          if-no-files-found: warn

      - name: Record release evidence in job summary
        if: success()
        run: cat release-evidence/semsource-ui-image.md >>"$GITHUB_STEP_SUMMARY"

      - name: Upload release evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: semsource-ui-image-${{ github.sha }}
          path: release-evidence/semsource-ui-image.md
          if-no-files-found: error

  # Red-main alerting (semsource#148): main CI failed for six straight weeks
  # (2026-07-21 → 2026-08-12) and nobody saw it, because a failed run notifies
  # no one by default and the broken job never runs on PRs. This job turns a
  # red main-branch run into an issue — created on first failure, commented on
  # repeats — so the breakage lands where work gets triaged.
  alert-red-main:
    needs:
      [
        test,
        test-integration,
        lint,
        ui-quality,
        build-and-push,
        publish-ui-build,
        publish-ui,
        ui-release-smoke,
      ]
    # Tag pushes run the same release chain and their failures are exactly the
    # tag-gate class this alert exists for — alert on both refs. (A run that
    # dies before jobs start — startup_failure — never evaluates this job; the
    # scheduled red-main-watchdog workflow covers that class.)
    if: failure() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or bump the red-main issue
        uses: actions/github-script@v8
        with:
          script: |
            const title = "CI is red on main";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Main-branch CI failed: ${runUrl}\n\ncommit: ${context.sha}\n\n` +
              "A red main blocks the tag gate. Triage the failing job before merging more work.";
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "ci-red-main", per_page: 1,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ["ci-red-main"],
              });
            }
