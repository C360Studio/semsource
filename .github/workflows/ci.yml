name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Unit tests
        run: go test -race ./...

  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # The critical-path integration suites (MCP answers, fusion pipeline,
      # versionDiff, readiness, staleness lifecycle) self-provision NATS via
      # testcontainers, and the object store suite provisions MinIO the same
      # way; ubuntu-latest runners ship Docker, so no service-container
      # choreography is needed here.
      #
      # This list is maintained by hand rather than being ./... — a package
      # missing from it has integration tests that compile, pass locally, and
      # never run. Add new ones as they land.
      - name: Integration tests
        run: go test -tags=integration ./internal/governance/ ./processor/mcp-gateway/ ./processor/code-context/ ./storage/s3store/ ./handler/objectstore/ ./processor/objectstore-source/

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/setup-task

      # The revive pin lives in Taskfile.yml's REVIVE_VERSION, and the vet /
      # gofmt / revive invocations live in its lint task. CI runs that one
      # definition rather than keeping a second copy that can drift from it —
      # and these copies already had drifted: they linted ./... including
      # ui/node_modules, which task lint deliberately filters out.
      - name: Install pinned dev tools
        run: |
          task tools:install
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: task lint

  ui-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install locked UI dependencies
        run: npm ci --ignore-scripts
        working-directory: ui

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
        working-directory: ui

      - name: UI format
        run: npm run format:check
        working-directory: ui

      - name: UI lint
        run: npm run lint
        working-directory: ui

      - name: UI type and Svelte checks
        run: npm run check
        working-directory: ui

      - name: UI unit tests
        run: npm test
        working-directory: ui

      - name: UI accessibility tests
        run: npm run test:a11y
        working-directory: ui

      - name: UI production build
        run: npm run build
        working-directory: ui

      - name: UI end-to-end tests
        run: npm run test:e2e
        working-directory: ui

      - uses: docker/setup-buildx-action@v4

      - uses: ./.github/actions/setup-task

      - name: Clean production image verification
        env:
          SEMSOURCE_UI_VERSION: sha-${{ github.sha }}
          SEMSOURCE_UI_COMMIT: ${{ github.sha }}
        run: task ui:image:verify

      - name: Release verifier contract tests
        run: task ui:image:release:test

  # The e2e suite is split by what a test COSTS, not by what it covers.
  #
  # This job runs the tests that need only Docker-backed NATS and a locally
  # built binary — no external repository is cloned, so nothing here depends on
  # a third-party host being up. Measured at ~26s of test time.
  #
  # Deliberately excluded, and where they run instead:
  #   TestE2E_OSH_JavaMavenIngest  clones github.com/opensensorhub/osh-core, a
  #                               large third-party repo (~29s). Its
  #                               availability is not ours, so it stays out of
  #                               the PR gate; run before release cuts.
  #   TestE2E_SubmoduleIngest      clones the C360Studio/semdev-test fixtures
  #                               (~27s). Same fixtures quickstart.yml already
  #                               clones, so promoting it is a bandwidth
  #                               question rather than a trust one.
  #   TestE2E_Quickstart*          already gated by quickstart.yml on its own
  #                               path filter; running them here would duplicate.
  #
  # TestE2E_UpgradePathRehearsal is the reason this job exists: it is the
  # executable proof of the documented upgrade path (purge graph state, restart,
  # graph re-derives from source, unrelated state survives). It went red on the
  # beta.161 bump and nobody saw it, because no e2e job ran in CI.
  e2e-local:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Black-box e2e (no external clones)
        run: |
          go test -tags=e2e -v -timeout 10m ./test/e2e/ \
            -run 'TestE2E_Version|TestE2E_Validate|TestE2E_NativeQuickStart|TestE2E_RunStartsAndPublishesEntities|TestE2E_RunFailsGracefullyWithoutNATS|TestE2E_RuntimeSourceAdd|TestE2E_UpgradePathRehearsal'

  build-and-push:
    needs: [test, lint, test-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # Runs on main pushes and on release tags (v*). Tag pushes produce the
    # versioned image; `latest` only moves on the default branch (not on a
    # pre-release beta tag).
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Inject the resolved version into the binary. On a tag build this is
          # the semver (e.g. 1.0.0-beta.1); on main it's the branch/sha fallback.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-ui:
    needs: [test, lint, ui-quality]
    runs-on: ubuntu-latest
    # Cold buildx cache + QEMU arm64 emulation blew through 15 minutes on the
    # first publish after six weeks of red mains (run 31630208346, cancelled
    # at 15:17 elapsed). Same budget class as ui-smoke-dev's cold build.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.repository }}
      digest: ${{ steps.publish.outputs.digest }}
      smoke_tag: ${{ steps.image.outputs.primary_tag }}
      version: ${{ steps.image.outputs.version }}
      revision: ${{ steps.image.outputs.revision }}
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v6

      - name: Derive immutable UI image metadata
        id: image
        env:
          IMAGE_REPOSITORY: ghcr.io/c360studio/semsource-ui
          SOURCE_REF: ${{ github.ref }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          ./scripts/ui-image-metadata.sh \
            --repository "$IMAGE_REPOSITORY" \
            --ref "$SOURCE_REF" \
            --ref-name "$SOURCE_REF_NAME" \
            --revision "$SOURCE_REVISION" \
            --output "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform workbench image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: ./ui
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SEMSOURCE_UI_VERSION=${{ steps.image.outputs.version }}
            SEMSOURCE_UI_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.image.outputs.tags }}
          provenance: mode=max
          sbom: true

  ui-release-smoke:
    needs: publish-ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup-task

      - name: Verify immutable registry image and provenance
        id: verify
        env:
          IMAGE_REPOSITORY: ${{ needs.publish-ui.outputs.image }}
          IMAGE_TAG: ${{ needs.publish-ui.outputs.smoke_tag }}
          IMAGE_DIGEST: ${{ needs.publish-ui.outputs.digest }}
          IMAGE_VERSION: ${{ needs.publish-ui.outputs.version }}
          IMAGE_REVISION: ${{ needs.publish-ui.outputs.revision }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p release-evidence
          ./scripts/ui-release-image-verify.sh \
            --repository "$IMAGE_REPOSITORY" \
            --tag "$IMAGE_TAG" \
            --digest "$IMAGE_DIGEST" \
            --version "$IMAGE_VERSION" \
            --revision "$IMAGE_REVISION" \
            --run-url "$RUN_URL" \
            --run-attempt "$RUN_ATTEMPT" \
            --output "$GITHUB_OUTPUT" \
            --evidence release-evidence/semsource-ui-image.md

      - name: Smoke exact published workbench digest
        env:
          SEMSOURCE_UI_IMAGE: ${{ steps.verify.outputs.image_ref }}
          UI_PROFILE_PIN_EVIDENCE_FILE: release-evidence/semsource-ui-image.md
        run: task ui:smoke

      - name: Upload UI profile failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: semsource-ui-smoke-failure-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: test-results/ui-profile/**
          if-no-files-found: warn

      - name: Record release evidence in job summary
        if: success()
        run: cat release-evidence/semsource-ui-image.md >>"$GITHUB_STEP_SUMMARY"

      - name: Upload release evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: semsource-ui-image-${{ github.sha }}
          path: release-evidence/semsource-ui-image.md
          if-no-files-found: error

  # Red-main alerting (semsource#148): main CI failed for six straight weeks
  # (2026-07-21 → 2026-08-12) and nobody saw it, because a failed run notifies
  # no one by default and the broken job never runs on PRs. This job turns a
  # red main-branch run into an issue — created on first failure, commented on
  # repeats — so the breakage lands where work gets triaged.
  alert-red-main:
    needs:
      [
        test,
        test-integration,
        lint,
        ui-quality,
        build-and-push,
        publish-ui,
        ui-release-smoke,
      ]
    # Tag pushes run the same release chain and their failures are exactly the
    # tag-gate class this alert exists for — alert on both refs. (A run that
    # dies before jobs start — startup_failure — never evaluates this job; the
    # scheduled red-main-watchdog workflow covers that class.)
    if: failure() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or bump the red-main issue
        uses: actions/github-script@v8
        with:
          script: |
            const title = "CI is red on main";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Main-branch CI failed: ${runUrl}\n\ncommit: ${context.sha}\n\n` +
              "A red main blocks the tag gate. Triage the failing job before merging more work.";
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "ci-red-main", per_page: 1,
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ["ci-red-main"],
              });
            }
