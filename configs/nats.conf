# NATS server settings the bundled compose stack runs with. An operator-provided
# NATS server needs the same values.
#
# max_pending: the server's per-client outbound buffer (default 64 MB). On a warm
# restart over a retained store, SemEngine replays the whole ENTITY_STATES bucket to
# several watchers at once over SemSource's one connection (about 690 MB at the
# 28k-entity OSH corpus). At 64 MB the server drops that connection as a slow
# consumer, the replay restarts on reconnect, and the service fails to start.
# 512 MB passed at that scale; see #351. Remove it once the upstream fix lands.
max_pending: 536870912
